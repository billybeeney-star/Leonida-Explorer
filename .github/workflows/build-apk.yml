
name: Build Leonida Explorer APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unpack Android project
        run: |
          unzip LeonidaExplorer-AndroidStudio.zip
          mv GTA6Countdown project

      - name: Build APK
        run: |
          cd project
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Leonida-Explorer-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
